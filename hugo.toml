baseURL = 'https://madbyad.my.id/'
locale = 'en-us'
title = 'MadByAd'

[build]
  [build.buildStats]
    enable = true
  [[build.cachebusters]]
    source = 'assets/notwatching/hugo_stats\.json'
    target = 'css'
  [[build.cachebusters]]
    source = '(postcss|tailwind)\.config\.js'
    target = 'css'

[module]
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    disableWatch = true
    source = 'hugo_stats.json'
    target = 'assets/notwatching/hugo_stats.json'

[security]
  [security.exec]
    allow = ['^(dart-)?sass$', '^go$', '^git$', '^node$', '^postcss$', '^tailwindcss$']
  allowContent = ['! ^text/html$']
  enableInlineShortcodes = false

[menus]
  [[menus.main]]
    name = 'Home'
    pageRef = '/'
    weight = 10
  [[menus.main]]
    name = 'News'
    pageRef = '/news'
    weight = 20
  [[menus.main]]
    name = 'About Us'
    pageRef = '/about-us'
    weight = 30
  [[menus.main]]
    name = 'Contact'
    pageRef = '/contact'
    weight = 40

[params]
description = "Crafting Games with MadByAd"

[taxonomies]
category = "categories"
tag = "tags"